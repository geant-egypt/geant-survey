<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Géant – استبيان رضا العملاء | Customer Survey</title>
<style>
:root{--bg:#f7ebea;--card:#fff;--ink:#2a1517;--mute:#6b5759;--line:#e6cfcd;--brand:#a50e16;--accent:#2e9b2f;--ok:#2e9b2f;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1a1012;--card:#26171a;--ink:#f8eceb;--mute:#c4a9ab;--line:#46282c;--brand:#d9262e;--accent:#4cc04d;--ok:#5fd394;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(180deg,#7d0a10 0%,#a50e16 100%);text-align:center;padding:22px 16px 0;border-bottom:6px solid #2e9b2f;color:#fff}
header h1{margin:0;font-size:1.55rem}
header p{margin:2px 0 0;opacity:.92}
.logo{display:inline-block;background:#fff;border-radius:24px;padding:10px 26px;margin:16px 0 -46px;box-shadow:0 8px 20px rgba(0,0,0,.3);border:4px solid #fff;position:relative}
.logo img{height:112px;width:auto;display:block}
main{max-width:640px;margin:0 auto;padding:62px 16px 16px}
footer{background:linear-gradient(180deg,#a50e16,#7d0a10);color:#fff;text-align:center;padding:18px 16px;margin-top:24px;border-top:5px solid #2e9b2f}

.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brand);border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.prog{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:6px;transition:width .4s ease}
.count{font-size:.85rem;color:var(--mute);direction:ltr;min-width:38px;text-align:center}
.back{border:0;background:none;color:var(--brand);font:inherit;font-size:.95rem;cursor:pointer;padding:4px 6px;width:auto;font-weight:600}
.back[hidden]{display:none}
.qt{font-size:1.2rem;font-weight:700;margin:18px 0 2px}
.qe{color:var(--mute);direction:ltr;text-align:left;font-size:.93rem;margin-bottom:16px}
#stage{min-height:260px}
.in{animation:slide .3s ease}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,-30px))}to{opacity:1;transform:none}}

.big{display:grid;gap:10px}
.big button,.yn button{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:16px;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.big button small,.yn button small{display:block;color:var(--mute);font-weight:400;direction:ltr}
.big button:hover,.yn button:hover{border-color:var(--brand);transform:translateY(-2px)}
button.sel{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
button.sel small{color:#fff!important}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .emo{font-size:2rem;display:block}

.faces{display:flex;gap:8px;justify-content:space-between}
.face{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 2px;cursor:pointer;color:var(--ink);font:inherit;text-align:center;transition:transform .15s,border-color .15s;width:auto}
.face .e{display:block;font-size:2.1rem;line-height:1.2;transition:transform .2s}
.face .a{display:block;font-size:.78rem;font-weight:600;margin-top:4px}
.face .n{display:block;font-size:.66rem;color:var(--mute);direction:ltr}
.face:hover{border-color:var(--brand);transform:translateY(-3px)}
.face:hover .e{transform:scale(1.2)}
.face.sel .e{transform:scale(1.3)}
.face.sel .n{color:#fff}
.note{margin-top:14px;animation:slide .3s ease;--dx:0;}
.note label{display:block;font-weight:600;margin-bottom:6px}
.note label span{display:block;color:var(--mute);font-weight:400;direction:ltr;text-align:left;font-size:.88rem}

select,textarea,input[type=text],input[type=tel]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px}
select:focus,textarea:focus,input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:6px}
.go:disabled{opacity:.6}
.hint{background:#fff3cd;color:#5c4400;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.92rem}
@media (prefers-color-scheme:dark){.hint{background:#4a3b00;color:#ffe9a6}}
#err{color:var(--err);min-height:1.3em;text-align:center;margin:6px 0 0}
.done{text-align:center;padding:26px 10px}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:3rem;line-height:84px;margin:0 auto 12px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.done h2{margin:0 0 6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main>

      <button class="back" id="back" hidden>→ رجوع</button>

<footer>شكراً لاختياركم جيان &nbsp;|&nbsp; Thank you for choosing Géant</footer>

<script>
// الصق رابط Google Apps Script هنا / Paste your Apps Script Web App URL here
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNqpdQIi10UMsBF2_W_mEmyO0M3XiAOl5mMKhHxsUs9dXUkwuf0cDqUdd92t12tkcolA/exec";

const faces=[["😍","5","راضي جداً","Very satisfied"],["🙂","4","راضي","Satisfied"],["😐","3","محايد","Neutral"],["🙁","2","غير راضي","Dissatisfied"],["😡","1","غير راضي إطلاقاً","Very bad"]];
const steps=[
 {k:"branch",t:"choice",ar:"اي فرع جيان قمت بزيارته اليوم ؟",en:"Which Géant branch did you visit today?",opts:[["تريمف / Triumph","تريمف","Triumph"],["الرحاب / Rehab","الرحاب","Rehab"]]},
 {k:"q1",t:"rate",ar:"مدي رضائك عن جودة اقسام الاغذيه الطازجه ؟",en:"How satisfied are you with the quality of the fresh food sections?"},
 {k:"q2",t:"rate",ar:"مدي رضائك عن طريقة العرض وسهولة الوصول الي المنتجات التي تريدها ؟",en:"How satisfied are you with the presentation method and ease of access to the products you want?"},
 {k:"q3",t:"rate",ar:"مدي رضائك عن العروض والاسعار بشكل عام ؟",en:"How satisfied are you with the offers and prices in general?"},
 {k:"q4",t:"rate",ar:"مدي رضائك علي مستوي الخدمة داخل الفرع واسلوب العاملين ؟",en:"How satisfied are you with the level of service within the branch and the style of the employees?"},
 {k:"q5",t:"yn",ar:"هل تريدنا ان نوفر برامج النقاط مثل ( بريميم - فودافون ...... ؟",en:"Would you like us to provide point apps such as Premium – Vodafone …?",emo:["👍","👎"]},
 {k:"q6",t:"yn",ar:"هل واجهتك اي مشاكل او صعوبات او شكوي خلال زيارتكم بالفرع ؟",en:"Did you face any problems, difficulties or complaints during your visit?",emo:["⚠️","✅"]},
 {k:"final",t:"final"}
];
const A={}, N={}; let i=0, dir=-30;
const $=id=>document.getElementById(id), stage=$("stage"), err=$("err");
const total=steps.length;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function head(s){return `<div class="qt">${s.ar}</div><div class="qe">${s.en}</div>`}

function render(){
  err.textContent="";
  const s=steps[i]; let h="";
  $("bar").style.width=(i/total*100)+"%";
  $("count").textContent=(i+1)+" / "+total;
  $("back").hidden=i===0;
  if(s.t==="choice"){
    h=head(s)+`<div class="big">`+s.opts.map(o=>`<button data-v="${esc(o[0])}" class="${A[s.k]===o[0]?'sel':''}">🏬 ${o[1]}<small>${o[2]}</small></button>`).join("")+`</div>`;
  }else if(s.t==="rate"){
    h=head(s)+`<div class="faces">`+faces.map(f=>`<button type="button" class="face ${A[s.k]===f[1]?'sel':''}" data-v="${f[1]}"><span class="e">${f[0]}</span><span class="a">${f[2]}</span><span class="n">${f[3]}</span></button>`).join("")+`</div><div id="noteBox"></div>`;
  }else if(s.t==="yn"){
    const v=["نعم","لا"],e=["Yes","No"];
    h=head(s)+`<div class="yn">`+v.map((x,j)=>`<button data-v="${x} / ${e[j]}" class="${A[s.k]===x+' / '+e[j]?'sel':''}"><span class="emo">${s.emo[j]}</span>${x}<small>${e[j]}</small></button>`).join("")+`</div>`;
  }else{
    const prob=(A.q6||"").startsWith("نعم");
    h=`<div class="qt">${prob?"احكيلنا إيه اللي حصل":"إذا كان لديك أي رأي، يرجى تركه هنا."}</div><div class="qe">${prob?"Tell us what happened":"Any opinion or problem? Please leave it here."}</div>`
     +(prob?`<div class="hint">⚠️ قلت إنك واجهت مشكلة، كلامك هيوصل للإدارة ونتابعه. / Your feedback goes straight to management.</div>`:"")
     +`<textarea id="comment" placeholder="اكتب هنا / Write here"></textarea>
       <div class="qe" style="margin:4px 0 8px">الاسم ورقم الهاتف (اختياري) / Name &amp; phone (optional)</div>
       <input type="text" id="name" placeholder="الاسم / Name" autocomplete="name">
       <input type="tel" id="phone" placeholder="الهاتف / Phone" autocomplete="tel" dir="ltr">
       <button class="go" id="submit">إرسال / Submit</button>`;
  }
  stage.innerHTML=`<div class="in" style="--dx:${dir}px">${h}</div>`;
  if(s.t==="rate"&&(A[s.k]==="1"||A[s.k]==="2")) showNote(s);
}

function showNote(s){
  $("noteBox").innerHTML=`<div class="note"><label for="nt">ايه اللي ضايقك؟ (اختياري)<span>What went wrong? (optional)</span></label><textarea id="nt">${esc(N[s.k]||"")}</textarea><button class="go" id="nx">التالي / Next</button></div>`;
  $("nx").onclick=()=>{N[s.k]=$("nt").value.trim();next()};
}
function next(){dir=-30;i++;render()}
function prev(){dir=30;i--;render()}

stage.addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;
  const s=steps[i], v=b.dataset.v; A[s.k]=v;
  stage.querySelectorAll("button[data-v]").forEach(x=>x.classList.toggle("sel",x===b));
  if(s.t==="rate"&&(v==="1"||v==="2")){showNote(s);setTimeout(()=>{const n=$("nt");n&&n.focus({preventScroll:true})},50);return}
  if(s.t==="rate"){delete N[s.k]}
  setTimeout(next,350);
});
$("back").onclick=prev;

stage.addEventListener("click",async e=>{
  if(e.target.id!=="submit") return;
  const btn=e.target; err.textContent=""; btn.disabled=true;
  let comment=$("comment").value.trim();
  Object.keys(N).forEach(k=>{if(N[k]) comment+=(comment?"\n":"")+"["+k.toUpperCase()+"] "+N[k]});
  const data={timestamp:new Date().toISOString(),branch:A.branch,q1:A.q1,q2:A.q2,q3:A.q3,q4:A.q4,q5:A.q5,q6:A.q6,comment,name:$("name").value.trim(),phone:$("phone").value.trim()};
  try{
    if(SCRIPT_URL){await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(data)})}
    else{console.log("Demo mode (no SCRIPT_URL):",data)}
    $("bar").style.width="100%"; $("count").textContent=total+" / "+total; $("back").hidden=true;
    stage.innerHTML=`<div class="done"><div class="check">✓</div><h2>شكراً لك!</h2><p>تم استلام ردك بنجاح، رأيك بيساعدنا نتطور.<br><span style="color:var(--mute)">Thank you, your response was received.</span></p></div>`;
    scrollTo({top:0,behavior:"smooth"});
  }catch(x){
    err.textContent="حصلت مشكلة في الإرسال، حاول تاني / Sending failed, please try again"; btn.disabled=false;
  }
});
render();
</script>
</body>
</html>
